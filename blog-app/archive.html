<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>文章归档 · 十二当归客</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============ 主题变量（与全站一致） ============ */
  :root {
    --bg: #fafaff;
    --card: #ffffff;
    --ink: #1a1a2e;
    --muted: #6b6b8a;
    --hairline: rgba(235, 237, 245, 0.6);
    --navbar-bg: rgba(255, 255, 255, 0.7);
    --navbar-border: rgba(235, 237, 245, 0.3);
    --navbar-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
    --tag-react-bg: rgba(80, 70, 229, 0.1);
    --tag-ts-bg: rgba(16, 185, 129, 0.1);
    --tag-vue-bg: rgba(245, 158, 11, 0.12);
    --tag-css-bg: rgba(255, 107, 157, 0.12);
    --blue: #6b8aff;
    --pink: #ff6b9d;
    --yellow: #f59e0b;
    --green: #10b981;
    --purple: #5046e5;
    --radius-card: 16px;
    --radius-sm: 12px;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC",
      "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  [data-theme="dark"] {
    --bg: #14161b;
    --card: #1c1f27;
    --ink: #e9ebf2;
    --muted: #98a0b4;
    --hairline: rgba(255, 255, 255, 0.08);
    --navbar-bg: rgba(22, 24, 30, 0.72);
    --navbar-border: rgba(255, 255, 255, 0.06);
    --navbar-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
    --tag-react-bg: rgba(140, 130, 255, 0.16);
    --tag-ts-bg: rgba(16, 185, 129, 0.18);
    --tag-vue-bg: rgba(245, 158, 11, 0.2);
    --tag-css-bg: rgba(255, 107, 157, 0.18);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    min-height: 100vh; position: relative; overflow-x: hidden;
    transition: background-color .4s ease, color .4s ease;
  }

  /* ---------- 背景柔光 ---------- */
  .bg-decor { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .bg-decor span { transition: opacity .4s ease; }
  .bg-decor .pink { position: absolute; top: 110px; left: -100px; width: 300px; height: 300px; border-radius: 50%; background: #ffe0eb; filter: blur(80px); opacity: .5; }
  .bg-decor .blue { position: absolute; top: -50px; right: -60px; width: 450px; height: 450px; border-radius: 50%; background: #e0e9ff; filter: blur(80px); opacity: .5; }
  [data-theme="dark"] .bg-decor .pink { opacity: .15; }
  [data-theme="dark"] .bg-decor .blue { opacity: .12; }

  /* ---------- 导航栏 ---------- */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; height: 64px;
    display: flex; align-items: center; justify-content: center;
    background: var(--navbar-bg);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--navbar-border);
    box-shadow: var(--navbar-shadow); z-index: 100;
    transition: background-color .4s ease, border-color .4s ease;
  }
  .nav-inner { width: 100%; max-width: 1200px; height: 64px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; }
  .nav-left { display: flex; align-items: center; gap: 10px; }
  .logo-img { width: 36px; height: 36px; display: block; flex-shrink: 0; }
  .logo-stack { display: flex; flex-direction: column; gap: -2px; line-height: 1.15; }
  .logo-title { font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: 2px; transition: color .4s ease; }
  .logo-sub { font-size: 12px; color: var(--muted); letter-spacing: 4px; transition: color .4s ease; }
  .nav-links { display: flex; align-items: center; gap: 32px; }
  .nav-links a { font-size: 15px; font-weight: 500; color: var(--muted); text-decoration: none; transition: color .2s ease; }
  .nav-links a:hover, .nav-links a.active { color: var(--ink); }
  .nav-links a.active { font-weight: 600; }
  .search-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; transition: color .2s ease; }
  .search-icon:hover { color: var(--ink); }

  /* ---------- 页面头部 ---------- */
  .page-header { margin-top: 88px; padding: 48px 40px 8px; text-align: center; }
  .page-kicker { font-size: 13px; font-weight: 600; letter-spacing: 3px; color: var(--pink); text-transform: uppercase; margin: 0 0 8px; }
  .page-title { font-size: 34px; font-weight: 800; margin: 0 0 8px; line-height: 1.2; }
  .page-desc { font-size: 15px; color: var(--muted); margin: 0 auto; max-width: 480px; }
  .page-count { display: inline-block; margin-top: 18px; font-size: 13px; font-weight: 600; color: var(--blue); background: rgba(107,138,255,.12); padding: 5px 16px; border-radius: 20px; }

  /* ---------- 归档列表 ---------- */
  .archive-wrap { max-width: 820px; margin: 0 auto; padding: 32px 40px 96px; }
  .year-group { margin-bottom: 36px; }
  .year-head {
    display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px;
    padding-bottom: 12px; border-bottom: 1px dashed var(--hairline);
  }
  .year-num { font-size: 26px; font-weight: 800; color: var(--ink); letter-spacing: -.5px; }
  .year-total { font-size: 13px; color: var(--muted); }

  .arc-item {
    display: flex; align-items: center; gap: 18px;
    padding: 16px 18px; margin-bottom: 12px;
    background: var(--card); border-radius: var(--radius-sm);
    box-shadow: var(--shadow-sm); text-decoration: none; color: inherit;
    border: 1px solid transparent;
    transition: transform .2s ease, box-shadow .25s ease, border-color .2s ease, background-color .4s ease;
  }
  .arc-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: rgba(107,138,255,.35); }
  .arc-date { flex-shrink: 0; width: 78px; text-align: center; }
  .arc-day { font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1; }
  .arc-month { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .arc-main { flex: 1; min-width: 0; }
  .arc-title {
    font-size: 16px; font-weight: 600; color: var(--ink); line-height: 1.45; margin: 0;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    transition: color .2s ease;
  }
  .arc-item:hover .arc-title { color: var(--blue); }
  .arc-excerpt { font-size: 13px; color: var(--muted); margin: 6px 0 0; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .arc-tag { flex-shrink: 0; font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
  .arc-arrow { flex-shrink: 0; color: var(--muted); transition: transform .2s ease, color .2s ease; }
  .arc-item:hover .arc-arrow { color: var(--blue); transform: translateX(3px); }

  .tag-react { background: var(--tag-react-bg); color: #5046e5; }
  .tag-ts { background: var(--tag-ts-bg); color: #059669; }
  .tag-vue { background: var(--tag-vue-bg); color: #d97706; }
  .tag-css { background: var(--tag-css-bg); color: #db2777; }
  .tag-python { background: rgba(107,138,255,.12); color: #2563eb; }
  .tag-docker { background: rgba(16,185,129,.12); color: #0891b2; }
  .tag-test { background: rgba(255,107,157,.12); color: #be185d; }
  .tag-devops { background: rgba(139,92,246,.14); color: #7c3aed; }

  /* ---------- 日夜切换 ---------- */
  .theme-toggle { position: fixed; bottom: 28px; right: 28px; z-index: 99; width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--card); box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); transition: all .3s ease; }
  .theme-toggle:hover { transform: scale(1.08); }
  .icon-sun { display: none; }
  [data-theme="dark"] .icon-moon { display: none; }
  [data-theme="dark"] .icon-sun { display: block; }

  /* ---------- 响应式 ---------- */
  @media (max-width: 768px) {
    .archive-wrap { padding: 24px 20px 72px; }
    .page-header { padding: 40px 20px 8px; }
    .nav-inner { padding: 0 20px; }
    .nav-links { gap: 18px; }
    .nav-links a:nth-child(n+4) { display: none; }
    .arc-excerpt { display: none; }
  }
</style>
</head>

<body>
  <div class="bg-decor">
    <span class="pink"></span><span class="blue"></span>
  </div>

  <!-- 悬浮导航栏 -->
  <header class="navbar">
    <div class="nav-inner">
      <div class="nav-left">
        <img class="logo-img" src="assets/logo.png" alt="logo" />
        <div class="logo-stack">
          <span class="logo-title">十二当归客</span>
          <span class="logo-sub">个人博客</span>
        </div>
      </div>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="articles.html">文章</a>
        <a href="archive.html" class="active">归档</a>
        <a href="about.html">关于</a>
      </nav>
      <div class="nav-right">
        <span class="search-icon" title="搜索">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M16 16L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </div>
    </div>
  </header>

  <!-- 页面头部 -->
  <section class="page-header">
    <p class="page-kicker">Archive</p>
    <h1 class="page-title">文章归档</h1>
    <p class="page-desc">按时间整理的全部文章，方便回顾每一个技术脚印。</p>
    <span class="page-count" id="arcCount">共 0 篇</span>
  </section>

  <!-- 归档列表（JS 渲染） -->
  <main class="archive-wrap" id="archiveList"></main>

  <!-- 日夜模式切换按钮 -->
  <button class="theme-toggle" id="themeToggle" aria-label="切换日夜模式" title="切换日夜模式">
    <svg class="icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" fill="currentColor"/></svg>
    <svg class="icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/></g></svg>
  </button>

  <script src="articles-data.js"></script>
  <script src="md.js"></script>
  <script>
    /* ===== 文章归档（按年份分组，数据来自 articles-data.js）===== */
    (function () {
      var list = document.getElementById('archiveList');
      var countEl = document.getElementById('arcCount');
      var data = window.BLOG_ARTICLES || [];

      // 按日期倒序
      var sorted = data.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      if (countEl) countEl.textContent = '共 ' + sorted.length + ' 篇';

      // 按年份分组
      var groups = {};
      sorted.forEach(function (a) {
        var y = (a.date || '').slice(0, 4) || '未知';
        (groups[y] = groups[y] || []).push(a);
      });
      var years = Object.keys(groups).sort(function (x, y) { return x < y ? 1 : -1; });

      if (!years.length) {
        list.innerHTML = '<div class="feed-empty" role="status" style="text-align:center;padding:72px 20px;color:var(--muted);">' +
          '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" style="opacity:.5;margin-bottom:14px;"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke-linejoin="round"/><path d="M14 3v6h6" stroke-linejoin="round"/><path d="M9 13h6M9 17h4" stroke-linecap="round"/></svg>' +
          '<p style="font-size:17px;font-weight:600;color:var(--text);margin:0 0 6px;">暂无归档文章</p>' +
          '<p style="font-size:14px;margin:0;opacity:.85;">文章发布后会按年份自动归档在这里。</p>' +
          '</div>';
        return;
      }

      list.innerHTML = years.map(function (y) {
        var items = groups[y].map(function (a) {
          var parts = (a.date || '').split('-');
          var month = parts[1] ? parts[1] + '月' : '';
          var day = parts[2] || '';
          return '<a class="arc-item" href="post.html?id=' + a.id + '">' +
            '<div class="arc-date"><div class="arc-day">' + day + '</div><div class="arc-month">' + month + '</div></div>' +
            '<div class="arc-main">' +
              '<h3 class="arc-title">' + a.title + '</h3>' +
              '<p class="arc-excerpt">' + (a.excerpt || '') + '</p>' +
            '</div>' +
            '<span class="arc-tag ' + (a.tagClass || 'tag-react') + '">' + (a.tag || '') + '</span>' +
            '<span class="arc-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
          '</a>';
        }).join('');
        return '<section class="year-group">' +
          '<div class="year-head"><span class="year-num">' + y + '</span><span class="year-total">' + groups[y].length + ' 篇</span></div>' +
          items +
        '</section>';
      }).join('');
    })();

    /* ===== 日夜切换 ===== */
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('themeToggle');
      try { var saved = localStorage.getItem('theme'); if (saved === 'dark' || saved === 'light') root.dataset.theme = saved; } catch (e) {}
      btn.addEventListener('click', function () {
        var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
