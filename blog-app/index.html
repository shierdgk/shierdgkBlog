<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十二当归客 · 技术博客</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============ 主题变量 ============ */
  :root {
    --bg: #fafaff;
    --card: #ffffff;
    --ink: #1a1a2e;
    --muted: #6b6b8a;
    --hairline: rgba(235, 237, 245, 0.6);
    --navbar-bg: rgba(255, 255, 255, 0.7);
    --navbar-border: rgba(235, 237, 245, 0.3);
    --navbar-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    --profile-grad: linear-gradient(180deg, #edf5ff 0%, #d9f0ff 100%);
    --avatar-bg: #ffffff;
    --profile-shadow: 0 8px 24px rgba(107, 138, 255, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
    --avatar-shadow: 0 4px 12px rgba(107, 138, 255, 0.18);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
    --hero-shadow: 0 12px 32px rgba(107, 138, 255, 0.18);
    --wave-opacity-1: 0.55;
    --wave-opacity-2: 0.85;
    --decor-pink: 0.5;
    --decor-blue: 0.5;
    --decor-yellow: 0.4;
    --tag-react-bg: rgba(80, 70, 229, 0.1);
    --tag-ts-bg: rgba(16, 185, 129, 0.1);
    --tag-vue-bg: rgba(245, 158, 11, 0.12);
    --tag-css-bg: rgba(255, 107, 157, 0.12);
    --blue: #6b8aff;
    --pink: #ff6b9d;
    --yellow: #f59e0b;
    --green: #10b981;
    --purple: #5046e5;
    --radius-card: 16px;
    --radius-sm: 12px;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC",
      "Microsoft YaHei", "Segoe UI", sans-serif;
  }

  /* ============ 夜间模式 ============ */
  [data-theme="dark"] {
    --bg: #14161b;
    --card: #1c1f27;
    --ink: #e9ebf2;
    --muted: #98a0b4;
    --hairline: rgba(255, 255, 255, 0.08);
    --navbar-bg: rgba(22, 24, 30, 0.72);
    --navbar-border: rgba(255, 255, 255, 0.06);
    --navbar-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    --profile-grad: linear-gradient(180deg, #1b2436 0%, #16203a 100%);
    --avatar-bg: #2a3550;
    --profile-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
    --avatar-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
    --hero-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    --wave-opacity-1: 0.5;
    --wave-opacity-2: 1;
    --decor-pink: 0.18;
    --decor-blue: 0.2;
    --decor-yellow: 0.14;
    --tag-react-bg: rgba(140, 130, 255, 0.16);
    --tag-ts-bg: rgba(16, 185, 129, 0.18);
    --tag-vue-bg: rgba(245, 158, 11, 0.2);
    --tag-css-bg: rgba(255, 107, 157, 0.18);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  /* ---------- 背景柔光装饰 ---------- */
  .bg-decor { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .bg-decor span { transition: opacity 0.4s ease; }
  .bg-decor .pink {
    position: absolute; top: 110px; left: -100px;
    width: 300px; height: 300px; border-radius: 50%;
    background: #ffe0eb; filter: blur(80px); opacity: var(--decor-pink);
  }
  .bg-decor .blue {
    position: absolute; top: -50px; right: -60px;
    width: 450px; height: 450px; border-radius: 50%;
    background: #e0e9ff; filter: blur(80px); opacity: var(--decor-blue);
  }
  .bg-decor .yellow {
    position: absolute; bottom: 120px; right: 80px;
    width: 350px; height: 350px; border-radius: 50%;
    background: #fff7de; filter: blur(60px); opacity: var(--decor-yellow);
  }

  /* ---------- 悬浮导航栏 ---------- */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; height: 64px;
    display: flex; align-items: center; justify-content: center;
    background: var(--navbar-bg);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--navbar-border);
    box-shadow: var(--navbar-shadow);
    z-index: 100;
    transition: background-color 0.4s ease, border-color 0.4s ease;
  }
  .nav-inner {
    width: 100%; max-width: 1200px; height: 64px;
    padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-left { display: flex; align-items: center; gap: 10px; }
  .logo-img { width: 36px; height: 36px; display: block; flex-shrink: 0; }
  .logo-stack { display: flex; flex-direction: column; gap: -2px; line-height: 1.15; }
  .logo-title { font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: 2px; transition: color 0.4s ease; }
  .logo-sub { font-size: 12px; color: var(--muted); letter-spacing: 4px; transition: color 0.4s ease; }
  .nav-links { display: flex; align-items: center; gap: 32px; }
  .nav-links a {
    font-size: 15px; font-weight: 500; color: var(--muted);
    text-decoration: none; transition: color 0.2s ease;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--ink); }
  .nav-links a.active { font-weight: 600; }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .search-icon {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); cursor: pointer;
  }

  /* ---------- Hero 全宽海报 ---------- */
  .hero {
    position: relative;
    width: 100%;
    height: 380px;
    margin-top: 0;
    overflow: hidden;
    background-image: url("assets/hero-coast.png");
    background-size: cover;
    background-position: center;
    box-shadow: var(--hero-shadow);
  }
  .hero-scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(20,22,30,0.30) 0%, rgba(20,22,30,0) 35%),
      linear-gradient(0deg, rgba(20,22,30,0.55) 0%, rgba(20,22,30,0) 55%);
  }
  .hero-content {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(-60%);
    text-align: center; color: #fff; padding: 0 24px;
    pointer-events: none;
  }
  .hero-kicker {
    font-size: 13px; font-weight: 700; letter-spacing: 3px;
    color: rgba(255,255,255,0.85); margin: 0 0 14px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .hero-title {
    font-size: 38px; font-weight: 700; line-height: 1.3; margin: 0;
    text-shadow: 0 2px 16px rgba(0,0,0,0.45);
  }

  /* 向下箭头按钮 */
  .hero-scroll {
    position: absolute; left: 50%; bottom: 26px;
    transform: translateX(-50%);
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.22);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff; text-decoration: none; z-index: 5;
    animation: bounce 2s ease-in-out infinite;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .hero-scroll:hover { background: rgba(255,255,255,0.38); transform: translateX(-50%) translateY(3px); }
  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(8px); }
  }

  /* 波浪动画 */
  .hero-waves { position: absolute; left: 0; right: 0; bottom: -1px; height: 96px; z-index: 3; pointer-events: none; }
  .hero-waves svg { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; }
  .wave-1 { fill: var(--bg); opacity: var(--wave-opacity-1); will-change: transform; animation: wave-move 16s linear infinite; }
  .wave-2 { fill: var(--bg); opacity: var(--wave-opacity-2); will-change: transform; animation: wave-move 11s linear infinite reverse; }
  @keyframes wave-move {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* ---------- 页面容器 ---------- */
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 80px; }

  /* ---------- 主体两栏布局 ---------- */
  .layout {
    display: flex; gap: 28px; align-items: flex-start;
    margin-top: 48px; padding-bottom: 96px;
  }
  .sidebar { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 24px; }
  .articles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; scroll-margin-top: 88px; }

  /* ---------- 卡片通用 ---------- */
  .card {
    background: var(--card); border-radius: var(--radius-card);
    box-shadow: var(--shadow-sm), var(--shadow-md);
    transition: background-color 0.4s ease, box-shadow 0.4s ease;
  }

  /* ---------- 个人信息卡 ---------- */
  .profile {
    padding: 32px; display: flex; flex-direction: column;
    align-items: center; gap: 20px;
    background-image: url("assets/profile-bg.png"), var(--profile-grad);
    background-size: cover, cover;
    background-position: center, center;
    background-repeat: no-repeat, no-repeat;
    background-color: var(--card);
    box-shadow: var(--profile-shadow);
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }
  [data-theme="dark"] .profile {
    background-image: linear-gradient(rgba(20, 22, 27, 0.72), rgba(20, 22, 27, 0.72)), url("assets/profile-bg.png");
    background-size: cover, cover;
    background-position: center, center;
    background-color: var(--card);
  }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    background: url('assets/avatar.jpg') center/cover no-repeat;
    border: 3px solid rgba(255, 255, 255, 0.8);
    box-shadow: var(--avatar-shadow);
    flex-shrink: 0;
  }
  .name { font-size: 26px; font-weight: 700; color: var(--ink); margin: 0; transition: color 0.4s ease; }
  .stats { width: 100%; display: flex; justify-content: space-between; align-items: flex-start; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
  .stat-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1.1; transition: color 0.4s ease; }

  /* ---------- 推荐位卡 ---------- */
  .rec { padding: 20px; display: flex; flex-direction: column; gap: 16px; cursor: pointer; text-decoration: none; transition: background-color 0.4s ease, box-shadow 0.25s ease, transform 0.25s ease; }
  .rec:hover { transform: translateY(-3px); }
  .rec-header { display: flex; align-items: center; gap: 8px; }
  .rec-title { font-size: 15px; font-weight: 600; color: var(--ink); transition: color 0.4s ease; }
  .rec-banner {
    position: relative;
    width: 100%; height: 160px; border-radius: var(--radius-sm);
    padding: 20px; display: flex; flex-direction: column; gap: 10px;
    background-image: url("assets/rec-bg.png");
    background-size: cover;
    background-position: center;
    overflow: hidden;
  }
  /* 引导点击手势 */
  .banner-hand {
    position: absolute; right: 16px; bottom: 14px;
    width: 46px; height: 46px; pointer-events: none; z-index: 2;
  }
  .banner-hand .hand {
    width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.28));
    transform-origin: 50% 85%;
    animation: hand-tap 1.6s ease-in-out infinite;
  }
  .banner-hand .ring {
    position: absolute; left: 50%; top: 58%;
    width: 34px; height: 34px; margin: -17px 0 0 -17px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.9);
    animation: tap-ring 1.6s ease-out infinite;
  }
  @keyframes hand-tap {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(7px) rotate(-5deg); }
  }
  @keyframes tap-ring {
    0% { transform: scale(0.45); opacity: 0.85; }
    70% { opacity: 0.2; }
    100% { transform: scale(1.8); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .banner-hand .hand, .banner-hand .ring { animation: none; }
    .banner-hand .ring { opacity: 0; }
  }
  .banner-title { font-size: 18px; font-weight: 700; color: #fff; margin: 0; }
  .banner-date { font-size: 11px; color: rgba(255, 255, 255, 0.7); margin: 0; }
  .banner-cta {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 20px;
    background: rgba(255, 255, 255, 0.25);
    font-size: 13px; font-weight: 500; color: #fff; margin-top: auto;
  }
  .rec-more { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
  .rec-more-head { display: flex; align-items: center; gap: 6px; }
  .rec-more-name { font-size: 14px; font-weight: 600; color: var(--ink); transition: color 0.4s ease; }
  .badge-hot {
    display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 10px;
    background: rgba(245, 158, 11, 0.15); font-size: 10px; font-weight: 700; color: var(--yellow);
  }
  .rec-more-desc { font-size: 12px; color: var(--muted); line-height: 18px; margin: 0; transition: color 0.4s ease; }

  /* ---------- 友情链接卡 ---------- */
  .links { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .links-title { font-size: 14px; font-weight: 600; color: var(--ink); margin: 0; transition: color 0.4s ease; }
  .link-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    font-size: 13px; color: var(--muted); transition: color 0.2s ease;
  }
  .link-item svg { flex-shrink: 0; }
  a.link-item { text-decoration: none; }
  a.link-item:hover { color: var(--pink, #ff6b9d); }

  /* ---------- 文章区 ---------- */
  .articles-header { display: flex; align-items: baseline; justify-content: space-between; }
  .articles-title { font-size: 22px; font-weight: 700; color: var(--ink); margin: 0; transition: color 0.4s ease; }
  .articles-count { font-size: 13px; color: var(--muted); transition: color 0.4s ease; }
  /* ---------- 作品集（首页模块网格，2 列）---------- */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 4px;
  }
  .portfolio-card {
    display: flex; flex-direction: column;
    border-radius: var(--radius-card);
    overflow: hidden;
    text-decoration: none; color: inherit;
    background: var(--card);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-sm);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .portfolio-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: rgba(107,138,255,.5); }
  .portfolio-banner {
    position: relative;
    height: 132px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background-size: cover !important;
    background-position: center !important;
  }
  .portfolio-banner .pf-initial {
    font-size: 44px; font-weight: 800; color: #fff;
    letter-spacing: 1px; text-shadow: 0 3px 10px rgba(0,0,0,.22);
  }
  .portfolio-badge {
    position: absolute; top: 12px; right: 12px;
    font-size: 11px; font-weight: 600; color: #fff;
    padding: 3px 10px; border-radius: 999px;
    background: rgba(10,12,20,.42);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .portfolio-body {
    padding: 18px 20px 20px;
    display: flex; flex-direction: column; gap: 10px;
    flex: 1; min-width: 0;
  }
  .portfolio-name { font-size: 18px; font-weight: 700; color: var(--ink); margin: 0; transition: color .4s ease; }
  .portfolio-desc { font-size: 13px; color: var(--muted); line-height: 21px; margin: 0; transition: color .4s ease; }
  .portfolio-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 4px; }
  .portfolio-soon {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .portfolio-soon::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); opacity: .6;
  }

  /* ---------- 分页 ---------- */
  .pager {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 28px; flex-wrap: wrap;
  }
  .pg {
    min-width: 38px; height: 38px; padding: 0 12px;
    border-radius: 10px; border: 1px solid var(--hairline);
    background: var(--card); color: var(--muted);
    font-size: 14px; cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: color .2s ease, border-color .2s ease, background .2s ease, opacity .2s ease;
  }
  .pg:hover:not(:disabled) { color: var(--ink); border-color: var(--blue); }
  .pg-active {
    background: linear-gradient(135deg, #ff6b9d, #6b8aff);
    color: #fff; border-color: transparent; font-weight: 600;
  }
  .pg:disabled { opacity: .4; cursor: not-allowed; }

  /* ---------- 日夜切换按钮 ---------- */
  .theme-toggle {
    position: fixed; right: 28px; bottom: 28px; z-index: 200;
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--hairline);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: background-color 0.4s ease, color 0.4s ease, transform 0.2s ease, box-shadow 0.4s ease;
  }
  .theme-toggle:hover { transform: translateY(-2px) rotate(15deg); box-shadow: 0 10px 28px rgba(0,0,0,0.22); }
  .theme-toggle .icon-moon { display: block; }
  .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }

  /* ---------- 回到顶部火箭 ---------- */
  .back-to-top {
    position: fixed; right: 28px;
    bottom: 88px; z-index: 98;
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--card); color: var(--pink);
    box-shadow: var(--shadow-md);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    opacity: 0; transform: translateY(16px) scale(.85);
    transition: opacity .35s ease, transform .35s ease, box-shadow .25s ease, background .4s ease;
    pointer-events: none;
  }
  .back-to-top.visible {
    opacity: 1; transform: translateY(0) scale(1); pointer-events: auto;
  }
  .back-to-top:hover {
    transform: translateY(-4px) scale(1.1);
    box-shadow: 0 10px 28px rgba(255,107,157,.22);
  }
  .back-to-top svg { width: 20px; height: 20px; }
  .back-to-top:hover .rocket-flame {
    animation: flame-flicker .3s infinite alternate;
  }
  @keyframes flame-flicker {
    from { transform: scaleY(1); opacity: 1; }
    to   { transform: scaleY(.65); opacity: .55; }
  }
  @media (prefers-reduced-motion: reduce) {
    .back-to-top { transition: none; }
    .back-to-top:hover .rocket-flame { animation: none; }
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 1080px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; }
    .sidebar .profile, .sidebar .rec, .sidebar .links { flex: 1; min-width: 280px; }
  }
  @media (max-width: 720px) {
    .wrap { padding: 0 20px; }
    .nav-links { gap: 18px; }
    .nav-links a:nth-child(n + 4) { display: none; }
    .hero { height: 300px; }
    .hero-title { font-size: 26px; }
    .sidebar { flex-direction: column; }
    .portfolio-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="pink"></span>
    <span class="blue"></span>
    <span class="yellow"></span>
  </div>

  <!-- 悬浮导航栏 -->
  <header class="navbar">
    <div class="nav-inner">
      <div class="nav-left">
        <img class="logo-img" src="assets/logo.png" alt="logo" />
        <div class="logo-stack">
          <span class="logo-title">十二当归客</span>
          <span class="logo-sub">个人博客</span>
        </div>
      </div>
      <nav class="nav-links">
        <a href="index.html" class="active">首页</a>
        <a href="articles.html">文章</a>
        <a href="archive.html">归档</a>
        <a href="about.html">关于</a>
      </nav>
      <div class="nav-right">
        <span class="search-icon" title="搜索">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
            <path d="M16 16L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </span>
      </div>
    </div>
  </header>

  <!-- Hero 全宽海报 -->
  <section class="hero">
    <div class="hero-scrim"></div>

      // 带 href 字段的模块会渲染为可点击链接；其余（如当前预留模块）为占位卡片。
      var portfolio = [
        {
          name: 'Tomorrow论坛',
          initial: 'T',
          desc: '面向技术人的内容社区与讨论平台，承载文章、问答与话题沉淀。点开即可体验完整论坛（离线静态版）。',
          banner: 'url(assets/covers/cover-tomorrow.webp)',
          badge: '立即体验',
          href: 'tomorrow-bbs/index.html'
        },
        {
          name: 'anytest平台',
          initial: 'A',
          desc: '一站式自动化测试管理与执行平台，覆盖用例、任务编排与报告（规划中）。',
          banner: 'url(assets/covers/cover-anytest.webp)',
          badge: '立即体验',
          href: 'test-platform/index.html'
        }
      ];

      var grid = document.getElementById('portfolioGrid');
      var countEl = document.getElementById('portfolioCount');
      if (countEl) countEl.textContent = '共 ' + portfolio.length + ' 个作品';

      grid.innerHTML = portfolio.map(function (p) {
        var isImageBanner = p.banner && p.banner.indexOf('url(') === 0;
        var inner =
          '<div class="portfolio-banner" style="background:' + p.banner + '">' +
            (isImageBanner ? '' : '<span class="pf-initial">' + p.initial + '</span>') +
            '<span class="portfolio-badge">' + (p.badge || '') + '</span>' +
          '</div>' +
          '<div class="portfolio-body">' +
            '<h3 class="portfolio-name">' + p.name + '</h3>' +
            '<p class="portfolio-desc">' + p.desc + '</p>' +
            '<div class="portfolio-foot">' +
              (p.soon ? '<span class="portfolio-soon">敬请期待</span>' : '') +
            '</div>' +
          '</div>';
        if (p.href) {
          return '<a class="portfolio-card" href="' + p.href + '">' + inner + '</a>';
        }
        return '<div class="portfolio-card" aria-disabled="true">' + inner + '</div>';
      }).join('');
    })();
  </script>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('themeToggle');
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') root.dataset.theme = saved;
      } catch (e) {}
      btn.addEventListener('click', function () {
        var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
      var rec = document.querySelector('.rec');
      if (rec) rec.addEventListener('click', function () { location.href = 'about.html'; });
    })();

    /* ===== 回到顶部火箭 ===== */
    (function () {
      var btn = document.getElementById('backToTop');
      if (!btn) return;
      function onScroll() {
        btn.classList.toggle('visible', window.scrollY > 360);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
      btn.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    })();
  </script>
