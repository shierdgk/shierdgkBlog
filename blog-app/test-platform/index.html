<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TestFlow · 企业级自动化测试平台</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="layout" id="app">
  <!-- Sidebar -->
  <aside class="aside" id="aside">
    <div class="brand" data-nav="/dashboard">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="url(#brandGrad)" />
          <path d="M9 16l4.5 4.5L23 11" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs><linearGradient id="brandGrad" x1="0" y1="0" x2="32" y2="32">
            <stop stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
        </svg>
      </div>
      <span class="brand-text">TestFlow</span>
    </div>
    <button class="collapse-btn" id="collapseBtn" title="收起菜单">«</button>
    <nav class="menu" id="menu"><!-- menu items injected --></nav>
    <div class="sidebar-footer"><div class="version">v1.0.0</div></div>
  </aside>

  <!-- Main -->
  <div class="main-wrap">
    <header class="header">
      <div class="header-left">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="ctx-bar">
          <div class="ctx-group">
            <span class="ctx-label">项目</span>
            <button class="ctx-btn" id="projBtn">
              <span class="ctx-icon">▣</span>
              <span class="ctx-text" id="projText">全部</span>
              <span class="ctx-caret">▾</span>
            </button>
          </div>
          <div class="ctx-sep"></div>
          <div class="ctx-group">
            <span class="ctx-label">环境</span>
            <button class="ctx-btn" id="envBtn">
              <span class="ctx-icon">◉</span>
              <span class="ctx-text" id="envText">未选</span>
              <span class="ctx-caret">▾</span>
            </button>
          </div>
        </div>
      </div>
      <div class="header-right">
        <button class="theme-toggle-btn" id="themeBtn" title="切换主题">☀</button>
        <div class="user-profile" id="userBtn">
          <div class="avatar" id="userAvatar">A</div>
          <span class="user-name" id="userName">admin</span>
          <span style="color:var(--text-muted);font-size:11px">▾</span>
          <div class="popover" id="userPop" style="right:0;top:42px">
            <div class="pop-item" style="cursor:default;color:var(--text-muted)" id="userRole"></div>
            <div class="pop-item" data-act="logout">退出登录</div>
          </div>
        </div>
      </div>
    </header>
    <main class="main-content" id="view"><!-- routed view --></main>
  </div>
</div>

<!-- Popovers for project / env -->
<div class="popover" id="projPop">
  <div class="popover-head"><input class="input pop-search" id="projSearch" placeholder="搜索项目，或输入以新建" /></div>
  <div class="pop-scroll" id="projList"></div>
  <div class="popover-foot">
    <button class="btn btn--sm" id="projNew">＋ 新建项目</button>
    <button class="btn btn--sm" data-nav="/projects">管理全部</button>
  </div>
</div>
<div class="popover" id="envPop">
  <div class="popover-head"><input class="input pop-search" id="envSearch" placeholder="搜索环境 / 地址" /></div>
  <div class="pop-scroll" id="envList"></div>
  <div class="popover-foot">
    <button class="btn btn--sm" data-nav="/environments">管理环境</button>
  </div>
</div>

<!-- Dialog mount -->
<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>

<!-- Toast -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- Back to blog -->
<a class="back-blog" href="../index.html">← 返回博客</a>

<script src="data/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
